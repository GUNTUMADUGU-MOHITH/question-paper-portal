<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Secure Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{--ink:#0d0d14;--accent:#6c63ff;--accent2:#f72585;--border:rgba(255,255,255,0.08);--muted:#8888a8;--text:#e8e8f0;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--text);min-height:100vh;min-height:-webkit-fill-available;display:flex;align-items:center;justify-content:center;padding:1rem;-webkit-font-smoothing:antialiased;}
h1,h2{font-family:'Syne',sans-serif;}
button{font-family:inherit;cursor:pointer;}

body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 60% at 50% 50%,rgba(108,99,255,.12) 0%,transparent 70%);pointer-events:none;}

.card{width:100%;max-width:400px;background:rgba(255,255,255,0.04);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.1);border-radius:22px;padding:clamp(24px,5vw,40px);position:relative;z-index:1;}
.icon-wrap{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#fff;margin:0 auto 22px;box-shadow:0 8px 28px rgba(108,99,255,0.4);}
h2{text-align:center;font-size:clamp(1.2rem,4vw,1.5rem);font-weight:800;margin-bottom:5px;}
.sub{text-align:center;color:var(--muted);font-size:0.84rem;margin-bottom:28px;}

.tabs{display:flex;background:rgba(255,255,255,0.04);border-radius:11px;padding:4px;margin-bottom:24px;border:1px solid var(--border);}
.tab{flex:1;padding:8px 6px;text-align:center;border-radius:8px;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--muted);border:none;background:transparent;}
.tab.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;}

.form-group{margin-bottom:15px;}
label{display:block;font-size:0.74rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:7px;}
input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;transition:all 0.22s;-webkit-appearance:none;}
input:focus{border-color:rgba(108,99,255,0.5);box-shadow:0 0 0 3px rgba(108,99,255,0.12);}
input::placeholder{color:var(--muted);}

.btn{width:100%;padding:13px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:0.93rem;border:none;transition:all 0.25s;box-shadow:0 4px 18px rgba(108,99,255,0.4);margin-top:7px;}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 28px rgba(108,99,255,0.5);}
.btn:active{transform:translateY(0);}

.error-msg{background:rgba(247,37,133,0.1);border:1px solid rgba(247,37,133,0.25);border-radius:11px;padding:11px 14px;font-size:0.83rem;color:#f87171;margin-bottom:18px;display:flex;align-items:center;gap:9px;}

#panel-creds,#panel-code{transition:opacity 0.22s;}
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap"><i class="fas fa-shield-halved"></i></div>
  <h2>Secure Access</h2>
  <p class="sub">Authorized personnel only</p>

  {% if error %}
  <div class="error-msg"><i class="fas fa-exclamation-triangle"></i> {{ error }}</div>
  {% endif %}

  <div class="tabs">
    <button class="tab active" id="tab-creds" onclick="switchTab('creds')"><i class="fas fa-user"></i> Credentials</button>
    <button class="tab" id="tab-code" onclick="switchTab('code')"><i class="fas fa-key"></i> Secret Code</button>
  </div>

  <form method="POST" autocomplete="off">
    <div id="panel-creds">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password">
      </div>
    </div>
    <div id="panel-code" style="display:none;">
      <div class="form-group">
        <label>Secret Code</label>
        <input type="password" name="secret_code" placeholder="Enter secret code" autocomplete="off">
      </div>
      <p style="font-size:0.76rem;color:var(--muted);margin-bottom:8px;">Enter the secret access code</p>
    </div>
    <button type="submit" class="btn"><i class="fas fa-unlock-alt"></i> Access Panel</button>
  </form>
</div>

<script>
function switchTab(type){
  if(type==='creds'){
    document.getElementById('tab-creds').classList.add('active');
    document.getElementById('tab-code').classList.remove('active');
    document.getElementById('panel-creds').style.display='';
    document.getElementById('panel-code').style.display='none';
  } else {
    document.getElementById('tab-code').classList.add('active');
    document.getElementById('tab-creds').classList.remove('active');
    document.getElementById('panel-code').style.display='';
    document.getElementById('panel-creds').style.display='none';
  }
}
</script>
</body>
</html>
